      // -----------------------------------------------------------------------
      // 8. 60FPS ANIMATION LOOP & TIMELINE SYNC
      // -----------------------------------------------------------------------
      let lastFrameMs = performance.now();

      function updateTimelineUI(t) {
        const clamped = Math.min(DURATION, Math.max(0, t));
        const pct = (clamped / DURATION) * 100;
        scrubberFill.style.width = `${pct.toFixed(2)}%`;
        scrubberThumb.style.left = `${pct.toFixed(2)}%`;
        scrubberTrack.setAttribute('aria-valuenow', clamped.toFixed(2));
        timecodeDisplay.textContent = `${clamped.toFixed(2).padStart(5, '0')}s / 06.50s`;

        let pIdx = 0;
        for (let i = PHASE_LABELS.length - 1; i >= 0; i--) {
          if (clamped >= PHASE_LABELS[i].t) { pIdx = i; break; }
        }
        if (pIdx !== lastPhaseIdx) {
          lastPhaseIdx = pIdx;
          phaseCaption.textContent = PHASE_LABELS[pIdx].text;
        }

        if (clamped >= 5.20 && warpOutStart < 0 && appOpenedOverlay.classList.contains('is-hidden')) {
          enterCtaWrap.classList.remove('is-hidden');
        }
      }

      function animate(nowMs) {
        requestAnimationFrame(animate);

        const dt = Math.min(0.05, Math.max(0.001, (nowMs - lastFrameMs) * 0.001));
        lastFrameMs = nowMs;

        pointer.x += (pointer.tx - pointer.x) * 0.065;
        pointer.y += (pointer.ty - pointer.y) * 0.065;

        let bass = 0, mid = 0, high = 0;
        if (analyser && freqData && isSoundEnabled && !isPaused && audioCtx && audioCtx.state === 'running') {
          analyser.getByteFrequencyData(freqData);
          for (let i = 0; i < 8; i++) bass += freqData[i];
          for (let i = 8; i < 28; i++) mid += freqData[i];
          for (let i = 28; i < 72; i++) high += freqData[i];
          bass /= (8 * 255);
          mid  /= (20 * 255);
          high /= (44 * 255);

          for (let i = 0; i < 24; i++) {
            const bin = Math.min(freqData.length - 1, Math.floor(i * 2.1 + 1));
            const val = Math.max(0.10, Math.min(1.0, (freqData[bin] / 255) * 1.18));
            vizBars[23 - i].style.transform = `scaleY(${val.toFixed(3)})`;
            vizBars[24 + i].style.transform = `scaleY(${val.toFixed(3)})`;
          }
        } else {
          for (let i = 0; i < 48; i++) {
            const idle = 0.10 + 0.06 * Math.abs(Math.sin(nowMs * 0.003 + i * 0.22));
            vizBars[i].style.transform = `scaleY(${idle.toFixed(3)})`;
          }
        }

        const ambientSec = nowMs * 0.001;
        let elapsed = 0;
        if (hasStarted) {
          if (manualSeekTime !== null) elapsed = manualSeekTime;
          else if (isPaused) elapsed = pausedAtSec;
          else elapsed = (nowMs - startTimestamp) * 0.001;

          updateTimelineUI(elapsed);
          if (isRecording) recLabel.textContent = `YOZILMOQDA • ${Math.min(DURATION, elapsed).toFixed(1)}s`;

          if (!isPaused) {
            if (prevTimeSec < 0.35 && elapsed >= 0.35) triggerBurst(1.15);
            if (prevTimeSec < 4.30 && elapsed >= 4.30) triggerBurst(1.0);
            prevTimeSec = elapsed;
          }
        }

        const impact = hasStarted
          ? Math.max(
              Math.exp(-Math.pow((elapsed - 0.35) / 0.22, 2)),
              Math.exp(-Math.pow((elapsed - 3.60) / 0.24, 2)) * 0.55,
              Math.exp(-Math.pow((elapsed - 4.30) / 0.30, 2)) * 0.90
            )
          : 0;

        if (hasStarted && !isPaused && !introDoneSent && elapsed >= DURATION - 0.04) {
          finishIntro(true);
        }
        const warpVal = warpOutStart >= 0 ? clamp01((nowMs - warpOutStart) / 920) : 0;

        renderScene(elapsed, ambientSec, dt, bass, mid, high, impact, warpVal);
      }

      // -----------------------------------------------------------------------
      // 9. CONTROLS, THEME SWITCHER, SCRUBBER, WARP-OUT & .WEBM VIDEO EXPORT
      // -----------------------------------------------------------------------
      function syncPlayPauseUI() {
        pauseIcon.style.display = isPaused ? 'none' : 'block';
        playIcon.style.display = isPaused ? 'block' : 'none';
      }

      function syncSoundUI() {
        soundOnIcon.style.display = isSoundEnabled ? 'block' : 'none';
        soundOffIcon.style.display = isSoundEnabled ? 'none' : 'block';
      }

      function startCinemaSequence(withAudio = true) {
        hasStarted = true;
        isPaused = false;
        pausedAtSec = 0;
        manualSeekTime = null;
        warpOutStart = -1;
        prevTimeSec = 0;
        lastPhaseIdx = -1;
        syncPlayPauseUI();

        entryPortal.classList.add('is-hidden');
        appOpenedOverlay.classList.add('is-hidden');
        enterCtaWrap.classList.add('is-hidden');
        bottomBar.classList.remove('is-hidden');
        topBar.classList.add('is-dimmed');

        startTimestamp = performance.now();
        updateTimelineUI(0);

        if (withAudio && isSoundEnabled) playStudioAudio();
        else stopAllAudio();
      }

      playPauseBtn.addEventListener('click', () => {
        if (!hasStarted) return startCinemaSequence(true);
        if (!isPaused) {
          isPaused = true;
          pausedAtSec = Math.min(DURATION, (performance.now() - startTimestamp) * 0.001);
          if (audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(() => {});
        } else {
          isPaused = false;
          if (pausedAtSec >= DURATION - 0.05) return startCinemaSequence(true);
          startTimestamp = performance.now() - pausedAtSec * 1000;
          if (audioCtx && audioCtx.state === 'suspended' && isSoundEnabled) audioCtx.resume().catch(() => {});
        }
        syncPlayPauseUI();
      });

      function seekFromClientX(clientX) {
        const rect = scrubberTrack.getBoundingClientRect();
        const frac = clamp01((clientX - rect.left) / Math.max(1, rect.width));
        const targetSec = frac * DURATION;
        hasStarted = true;
        manualSeekTime = targetSec;
        pausedAtSec = targetSec;
        prevTimeSec = targetSec;
        stopAllAudio();
        updateTimelineUI(targetSec);
      }

      scrubberTrack.addEventListener('pointerdown', (e) => {
        isScrubbing = true;
        scrubberTrack.setPointerCapture(e.pointerId);
        seekFromClientX(e.clientX);
      });
      scrubberTrack.addEventListener('pointermove', (e) => {
        if (isScrubbing) seekFromClientX(e.clientX);
      });
      scrubberTrack.addEventListener('pointerup', (e) => {
        if (!isScrubbing) return;
        isScrubbing = false;
        scrubberTrack.releasePointerCapture(e.pointerId);
        if (manualSeekTime !== null) {
          startTimestamp = performance.now() - manualSeekTime * 1000;
          manualSeekTime = null;
        }
      });

      themeBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          activeThemeIdx = Number(btn.dataset.theme) || 0;
          themeBtns.forEach((b) => b.classList.toggle('is-active', b === btn));
          modeLabel.textContent = `${THEMES[activeThemeIdx].name} • Samoviy Medalyon`;
          playUIClick(783.99 + activeThemeIdx * 110);
          showToast(`Mavzu: ${THEMES[activeThemeIdx].name}`);
        });
      });

      soundToggleBtn.addEventListener('click', () => {
        isSoundEnabled = !isSoundEnabled;
        syncSoundUI();
        if (!isSoundEnabled) {
          stopAllAudio();
          showToast('Ovoz o‘chirildi');
        } else {
          playUIClick(1046.5);
          showToast('Ovoz yoqildi');
          if (hasStarted && !isPaused) startCinemaSequence(true);
        }
      });

      async function exportIntroAsWebM() {
        if (isRecording) return;
        if (typeof MediaRecorder === 'undefined' || !canvas.captureStream) {
          return showToast('Brauzeringiz .webm eksportini qo‘llab-quvvatlamaydi');
        }
        try {
          isRecording = true;
          exportVideoBtn.disabled = true;
          exportBtnText.textContent = 'Yozilmoqda...';
          recBadge.classList.add('is-visible');

          ensureAudioContext();
          const videoStream = canvas.captureStream(60);
          const tracks = [...videoStream.getVideoTracks()];
          if (isSoundEnabled && mediaStreamDest && mediaStreamDest.stream) {
            mediaStreamDest.stream.getAudioTracks().forEach((tr) => tracks.push(tr));
          }
          const combined = new MediaStream(tracks);
          const mimes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
          const chosen = mimes.find((m) => MediaRecorder.isTypeSupported(m)) || '';

          const recorder = new MediaRecorder(
            combined,
            chosen ? { mimeType: chosen, videoBitsPerSecond: 10000000 } : { videoBitsPerSecond: 10000000 }
          );
          const chunks = [];
          recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
          recorder.onstop = () => {
            isRecording = false;
            exportVideoBtn.disabled = false;
            exportBtnText.textContent = 'Video (.webm)';
            recBadge.classList.remove('is-visible');
            if (chunks.length) {
              const blob = new Blob(chunks, { type: chosen || 'video/webm' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'husanboy_teacher_intro.webm';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(() => URL.revokeObjectURL(url), 4000);
              showToast('6.5s video (husanboy_teacher_intro.webm) yuklab olindi!', 3400);
            }
          };

          recorder.start(100);
          startCinemaSequence(true);

          setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
          }, 7000);
        } catch (err) {
          console.error(err);
          isRecording = false;
          exportVideoBtn.disabled = false;
          exportBtnText.textContent = 'Video (.webm)';
          recBadge.classList.remove('is-visible');
          showToast('Video eksportida xatolik yuz berdi');
        }
      }

      startIntroBtn.addEventListener('click', () => startCinemaSequence(true));
      replayBtn.addEventListener('click', () => startCinemaSequence(true));
      replayFromOpenedBtn.addEventListener('click', () => startCinemaSequence(true));
      exportVideoBtn.addEventListener('click', exportIntroAsWebM);

      let introDoneSent = false;
      function finishIntro(withWarp) {
        if (introDoneSent) return;
        introDoneSent = true;
        enterCtaWrap.classList.add('is-hidden');
        const skipEl = document.getElementById('skipIntroBtn');
        if (skipEl) skipEl.style.display = 'none';
        if (withWarp) {
          warpOutStart = performance.now();
          try { playWarpWhoosh(); } catch (_) {}
          try { triggerBurst(1.55); } catch (_) {}
          setTimeout(() => {
            stopAllAudio();
            try { window.parent.postMessage({ type: 'HT_INTRO_DONE' }, '*'); } catch (_) {}
          }, 980);
        } else {
          stopAllAudio();
          try { window.parent.postMessage({ type: 'HT_INTRO_DONE' }, '*'); } catch (_) {}
        }
      }

      enterAppBtn.addEventListener('click', () => finishIntro(true));
      const skipBtn = document.getElementById('skipIntroBtn');
      if (skipBtn) skipBtn.addEventListener('click', () => finishIntro(false));

      // Auto-start 6.5s cinematic intro immediately when app opens
      window.onload = function () {
        syncSoundUI();
        syncPlayPauseUI();
        requestAnimationFrame(animate);
        setTimeout(() => {
          try { startCinemaSequence(true); } catch (_) { startCinemaSequence(false); }
        }, 60);
        // Generous failsafe only if RAF is suspended
        setTimeout(() => finishIntro(true), 10500);
      };
    })();
  </script>
</body>
